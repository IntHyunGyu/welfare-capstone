spring:
  application:
    name: welfare-capstone
  # 로컬 화면 개발용 DB: H2(파일 기반, ./data/welfare). 배포 시 MySQL 설정은 application-prod.yml.
  datasource:
    url: jdbc:h2:file:./data/welfare;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

welfare:
  api:
    service-key: ${WELFARE_API_SERVICE_KEY:}
    base-url: https://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations
    # 목록조회 1회 호출당 건수. 값을 올리면 전체 수집에 필요한 호출 횟수가 줄어든다.
    page-size: 200
    # 배치 1회 실행에서 허용할 최대 페이지(=최대 API 호출) 수.
    # 개발계정 일 1,000회 제한을 고려한 안전장치 - 전체 데이터가 이보다 많으면 여러 날에 나눠 수동 실행한다.
    max-pages: 50

llm:
  # 비어 있으면 LLM 요약을 건너뛰고 상세 화면에 원문만 보여준다.
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-opus-5-5
