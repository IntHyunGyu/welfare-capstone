spring:
  application:
    name: welfare-capstone
  # 로컬 화면 개발용 DB: H2(파일 기반, ./data/welfare). 배포 시 MySQL 설정은 application-prod.yml.
  datasource:
    url: jdbc:h2:file:./data/welfare;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

welfare:
  api:
    service-key: ${WELFARE_API_SERVICE_KEY:}
    base-url: https://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations
    # 목록조회 1회 호출당 건수. 값을 올리면 전체 수집에 필요한 호출 횟수가 줄어든다.
    page-size: 200
    # 배치 1회 실행에서 허용할 최대 페이지(=최대 API 호출) 수.
    # 개발계정 일 1,000회 제한을 고려한 안전장치 - 전체 데이터가 이보다 많으면 여러 날에 나눠 수동 실행한다.
    max-pages: 50

  admin:
    # 관리자 페이지(/manage)에 들어갈 수 있는 아이디 (콤마 구분). 본인이 먼저 가입한 아이디를 적는다.
    usernames: ${ADMIN_USERNAMES:}
  security:
    # "로그인 상태 유지" 쿠키 서명 키. 로컬 기본값이 있고 prod는 REMEMBER_ME_KEY가 필수.
    remember-me-key: ${REMEMBER_ME_KEY:local-dev-remember-me-key}

llm:
  # 비어 있으면 LLM 요약을 건너뛰고 상세 화면에 원문만 보여준다.
  api-key: ${ANTHROPIC_API_KEY:}
  # Haiku 5.5: 100만 토큰당 입력 $0.10 / 출력 $0.50 (opus-5-5의 1/40). 거절 시 서버측 fallback은 지원하지 않는다.
  model: claude-haiku-5-5
  # 관리자 페이지의 추정 비용 계산용 단가 (100만 토큰당 달러, 프롬프트 10만 토큰 이하 기준). 모델을 바꾸면 같이 바꿀 것.
  input-price-per-million: 0.10
  output-price-per-million: 0.50
