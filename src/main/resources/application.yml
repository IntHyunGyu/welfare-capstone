spring:
  application:
    name: welfare-capstone
  # 로컬 화면 개발용 DB: H2(파일 기반, ./data/welfare). 배포 시에는 이 datasource를
  # MySQL 설정(아래 주석 참고)으로 교체한 prod 프로필을 추가해서 띄울 것.
  # mysql 설정 예시:
  #   url: jdbc:mysql://localhost:3306/welfare_capstone?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  #   username: ${DB_USERNAME:root}
  #   password: ${DB_PASSWORD:}
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  datasource:
    url: jdbc:h2:file:./data/welfare;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

welfare:
  api:
    service-key: ${WELFARE_API_SERVICE_KEY:}
    base-url: https://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations
    # 목록조회 1회 호출당 건수. 값을 올리면 전체 수집에 필요한 호출 횟수가 줄어든다.
    page-size: 200
    # 배치 1회 실행에서 허용할 최대 페이지(=최대 API 호출) 수.
    # 개발계정 일 1,000회 제한을 고려한 안전장치 - 전체 데이터가 이보다 많으면 여러 날에 나눠 수동 실행한다.
    max-pages: 50

llm:
  api:
    key: ${LLM_API_KEY:}
    base-url: ${LLM_API_BASE_URL:}
