<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 복지 - 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragments/head :: common}"></th:block>
</head>
<body>
<div class="container narrow">
    <div class="top">
        <a class="brand" th:href="@{/}">
            <img class="mark" th:src="@{/icon.svg}" alt="" width="34" height="34">
            <span>오늘의 복지</span>
        </a>
    </div>
    <h1>회원가입</h1>
    <p class="subtitle">아이디와 비밀번호만 있으면 돼요. 이메일 같은 개인정보는 받지 않아요.</p>

    <div class="form-notice error" th:if="${errors}" role="alert">
        <p th:each="error : ${errors}" th:text="${error}"></p>
    </div>

    <form th:action="@{/signup}" method="post">
        <div class="form-card auth-card">
            <div class="field">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" th:value="${username}" autocomplete="username"
                       pattern="[a-z0-9_]{4,20}" maxlength="20" required autofocus>
                <p class="field-hint">영문 소문자, 숫자, 밑줄(_)로 4~20자</p>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" autocomplete="new-password"
                       minlength="8" maxlength="64" required>
                <p class="field-hint">8자 이상</p>
            </div>
            <div class="field">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password"
                       minlength="8" maxlength="64" required>
            </div>
        </div>
        <div class="submit-area">
            <button class="submit" type="submit">가입하기</button>
        </div>
    </form>
    <p class="auth-switch">이미 회원이신가요? <a th:href="@{/login}">로그인</a></p>
</div>
</body>
</html>
