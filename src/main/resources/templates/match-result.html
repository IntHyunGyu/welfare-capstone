<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 복지 - 내 혜택 결과</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container wide">
    <div class="top">
        <div>
            <div class="brand">
                <div class="mark">오</div>
                <span>오늘의 복지</span>
            </div>
            <h1>내 맞춤 혜택</h1>
            <p class="subtitle"><strong th:text="${#lists.size(benefits)}"></strong>건의 혜택을 찾았어요</p>
        </div>
        <div class="nav-links">
            <a class="back-link" th:href="@{/favorites}">★ 저장한 혜택</a>
            <a class="back-link" th:href="@{/profile}">← 조건 다시 입력</a>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(benefits)}">
        조건에 맞는 혜택을 찾지 못했어요.<br>조건을 조금 넓혀서 다시 시도해보세요.
    </div>

    <th:block th:each="b : ${benefits}">
        <div th:replace="~{fragments/benefit-card :: card(${b})}"></div>
    </th:block>
</div>
<script th:src="@{/js/favorites.js}"></script>
</body>
</html>
