<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 복지 - 내 혜택 결과</title>
    <style>
        :root {
            --accent: #3182f6;
            --accent-soft: #eef3ff;
            --ink: #191f28;
            --ink-sub: #6b7684;
            --line: #e5e8eb;
            --surface: #f2f4f6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: var(--surface);
            margin: 0;
            color: var(--ink);
        }
        .container { max-width: 720px; margin: 0 auto; padding: 48px 20px 100px; }

        .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .brand .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
        .brand span { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
        h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
        .subtitle { color: var(--ink-sub); margin: 0; font-size: 14px; }
        .subtitle strong { color: var(--accent); }

        .back-link {
            flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px;
            padding: 9px 16px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line);
            color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap;
            transition: border-color 0.12s ease;
        }
        .back-link:hover { border-color: var(--accent); color: var(--accent); }

        .empty {
            background: #fff; border-radius: 20px; padding: 56px 24px; text-align: center;
            color: var(--ink-sub); font-size: 15px; box-shadow: 0 2px 10px rgba(25, 31, 40, 0.04);
        }

        .card {
            background: #fff; border-radius: 18px; padding: 22px 24px; margin-bottom: 14px;
            box-shadow: 0 2px 10px rgba(25, 31, 40, 0.04);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(25, 31, 40, 0.08); }
        .card h2 { font-size: 17px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
        .card .dgst { color: #333d4b; font-size: 14px; line-height: 1.6; margin: 0 0 14px; }

        .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 16px; }
        .meta span { background: var(--surface); color: var(--ink-sub); padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; }

        .card-footer { display: flex; justify-content: flex-end; }
        .card a.detail-link {
            display: inline-flex; align-items: center; gap: 4px;
            color: var(--accent); text-decoration: none; font-size: 13.5px; font-weight: 700;
            padding: 8px 14px; border-radius: 999px; background: var(--accent-soft);
            transition: background 0.12s ease;
        }
        .card a.detail-link:hover { background: #dfe9ff; }

        @media (max-width: 560px) {
            .top { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top">
        <div>
            <div class="brand">
                <div class="mark">오</div>
                <span>오늘의 복지</span>
            </div>
            <h1>내 맞춤 혜택</h1>
            <p class="subtitle"><strong th:text="${#lists.size(benefits)}"></strong>건의 혜택을 찾았어요</p>
        </div>
        <a class="back-link" th:href="@{/profile}">← 조건 다시 입력</a>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(benefits)}">
        조건에 맞는 혜택을 찾지 못했어요.<br>조건을 조금 넓혀서 다시 시도해보세요.
    </div>

    <div class="card" th:each="b : ${benefits}">
        <h2 th:text="${b.servNm}"></h2>
        <p class="dgst" th:if="${b.servDgst}" th:text="${b.servDgst}"></p>
        <div class="meta">
            <span th:if="${b.sprtCycNm}" th:text="'지원주기 · ' + ${b.sprtCycNm}"></span>
            <span th:if="${b.aplyMtdNm}" th:text="'신청방법 · ' + ${b.aplyMtdNm}"></span>
            <span th:if="${b.ctpvNm}" th:text="${b.ctpvNm} + (${b.sggNm} != null ? ' ' + ${b.sggNm} : '')"></span>
        </div>
        <div class="card-footer" th:if="${b.servDtlLink}">
            <a class="detail-link" th:href="${b.servDtlLink}" target="_blank" rel="noopener">자세히 보기 →</a>
        </div>
    </div>
</div>
</body>
</html>
