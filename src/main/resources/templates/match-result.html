<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 복지 - 내 혜택 결과</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragments/head :: common}"></th:block>
</head>
<body>
<main class="container">
    <div class="top">
        <div>
            <a th:replace="~{fragments/brand :: brand}"></a>
            <h1>내 맞춤 혜택</h1>
            <p class="subtitle"><strong th:text="${#lists.size(benefits)}"></strong>건의 혜택을 찾았어요</p>
        </div>
        <div class="nav-links">
            <a class="back-link" th:href="@{/favorites}"><svg th:replace="~{fragments/icons :: bookmarkOutline}"></svg><span class="nav-text">저장한 혜택</span></a>
            <a class="back-link" th:href="@{/profile}">← 조건 수정</a>
            <th:block th:replace="~{fragments/account :: links}"></th:block>
        </div>
    </div>

    <div class="conditions" th:unless="${#lists.isEmpty(conditions)}">
        <span class="conditions-label" th:text="${savedToAccount} ? '내 저장된 조건' : '찾은 조건'">찾은 조건</span>
        <span class="condition" th:each="c : ${conditions}" th:text="${c}"></span>
        <a class="text-link" th:href="@{/profile}">수정</a>
    </div>

    <section class="since-visit" th:if="${lastVisitAt != null}"
             th:with="visitDay=${#temporals.format(lastVisitAt, 'M월 d일')}, newCount=${#lists.size(newSinceLastVisit)}">
        <th:block th:if="${newCount > 0}">
            <h2>지난 방문(<span th:text="${visitDay}"></span>) 이후 내 조건에 새로 맞는 혜택
                <strong th:text="${newCount} + '건'"></strong></h2>
            <ul>
                <li th:each="b, st : ${newSinceLastVisit}" th:if="${st.index < 10}">
                    <a th:href="@{/benefits/{id}(id=${b.servId}, from='match')}" th:text="${b.servNm}"></a>
                </li>
            </ul>
            <p class="since-more" th:if="${newCount > 10}" th:text="'외 ' + ${newCount - 10} + '건은 아래 목록에서 볼 수 있어요.'"></p>
        </th:block>
        <p class="since-none" th:if="${newCount == 0}"
           th:text="'지난 방문(' + ${visitDay} + ') 이후 내 조건에 새로 맞는 혜택은 없어요.'"></p>
    </section>

    <div class="empty" th:if="${#lists.isEmpty(benefits)}">
        조건에 맞는 혜택을 찾지 못했어요.<br>조건을 조금 넓혀서 다시 시도해보세요.
        <div class="empty-action"><a class="pill-link" th:href="@{/profile}">조건 수정하기</a></div>
    </div>

    <th:block th:each="b : ${benefits}">
        <div th:replace="~{fragments/benefit-card :: card(${b}, 'match')}"></div>
    </th:block>
</main>
<script th:src="@{/js/favorites.js}"></script>
</body>
</html>
