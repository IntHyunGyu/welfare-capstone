<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 복지 - 내 혜택 결과</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container wide">
    <div class="top">
        <div>
            <div class="brand">
                <div class="mark">오</div>
                <span>오늘의 복지</span>
            </div>
            <h1>내 맞춤 혜택</h1>
            <p class="subtitle"><strong th:text="${#lists.size(benefits)}"></strong>건의 혜택을 찾았어요</p>
        </div>
        <a class="back-link" th:href="@{/profile}">← 조건 다시 입력</a>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(benefits)}">
        조건에 맞는 혜택을 찾지 못했어요.<br>조건을 조금 넓혀서 다시 시도해보세요.
    </div>

    <div class="result-card" th:each="b : ${benefits}">
        <h2 th:text="${b.servNm}"></h2>
        <p class="dgst" th:if="${b.servDgst}" th:text="${b.servDgst}"></p>
        <div class="meta">
            <span th:if="${b.sprtCycNm}" th:text="'지원주기 · ' + ${b.sprtCycNm}"></span>
            <span th:if="${b.aplyMtdNm}" th:text="'신청방법 · ' + ${b.aplyMtdNm}"></span>
            <span th:if="${b.ctpvNm}" th:text="${b.ctpvNm} + (${b.sggNm} != null ? ' ' + ${b.sggNm} : '')"></span>
        </div>
        <div class="card-footer">
            <a class="text-link" th:if="${b.servDtlLink}" th:href="${b.servDtlLink}" target="_blank" rel="noopener">복지로 원문</a>
            <a class="pill-link" th:href="@{/benefits/{id}(id=${b.servId})}">자세히 보기 →</a>
        </div>
    </div>
</div>
</body>
</html>
