<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 복지 - 저장한 혜택</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragments/head :: common}"></th:block>
</head>
<body>
<main class="container wide" data-fav-page>
    <div class="top">
        <div>
            <a th:replace="~{fragments/brand :: brand}"></a>
            <h1>저장한 혜택</h1>
            <p class="subtitle" th:if="${benefits != null}">
                <strong th:text="${#lists.size(benefits)}"></strong>건을 저장해 두었어요 · 이 기기에만 저장돼요
            </p>
        </div>
        <div class="nav-links">
            <a class="back-link" th:href="@{/match}">맞춤 혜택</a>
            <a class="back-link" th:href="@{/profile}">← 조건 입력</a>
            <th:block th:replace="~{fragments/account :: links}"></th:block>
        </div>
    </div>

    <div class="empty" th:if="${benefits == null}" th:attr="data-fav-load=@{/favorites}">
        저장한 혜택을 불러오는 중이에요…
    </div>

    <div class="empty" th:if="${benefits != null and #lists.isEmpty(benefits)}">
        아직 저장한 혜택이 없어요.<br>혜택 카드의 저장 버튼을 누르면 여기에 모아 볼 수 있어요.
        <div class="empty-action"><a class="pill-link" th:href="@{/match}">맞춤 혜택 보러 가기</a></div>
    </div>

    <th:block th:each="b : ${benefits}">
        <div th:replace="~{fragments/benefit-card :: card(${b}, 'favorites')}"></div>
    </th:block>
</main>
<script th:src="@{/js/favorites.js}"></script>
</body>
</html>
