<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 복지 - 내 정보 입력</title>
    <style>
        body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f5f6f8; margin: 0; color: #1f2328; }
        .container { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
        h1 { font-size: 28px; margin-bottom: 4px; }
        .subtitle { color: #6b7280; margin-top: 0; margin-bottom: 28px; }
        fieldset { border: 1px solid #e2e4e8; border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; background: #fff; }
        legend { font-weight: 600; padding: 0 6px; }
        .options { display: flex; flex-wrap: wrap; gap: 10px 18px; }
        .options label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .field input[type=number], .field input[type=text], .field select {
            width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px;
        }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="container">
    <h1>오늘의 복지</h1>
    <p class="subtitle">체크만 하면, 오늘 나에게 해당되는 지자체 복지혜택을 찾아드려요.</p>

    <form th:action="@{/profile}" method="post">
        <fieldset>
            <legend>생애주기</legend>
            <div class="options">
                <label th:each="stage : ${lifeStages}">
                    <input type="checkbox" name="lifeCodes" th:value="${stage.code}">
                    <span th:text="${stage.label}"></span>
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>가구상황</legend>
            <div class="options">
                <label th:each="h : ${householdSituations}">
                    <input type="checkbox" name="householdCodes" th:value="${h.code}">
                    <span th:text="${h.label}"></span>
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>관심주제</legend>
            <div class="options">
                <label th:each="t : ${interestThemes}">
                    <input type="checkbox" name="themeCodes" th:value="${t.code}">
                    <span th:text="${t.label}"></span>
                </label>
            </div>
        </fieldset>

        <div class="field">
            <label for="age">나이</label>
            <input type="number" id="age" name="age" min="0" max="120" placeholder="예: 27">
        </div>

        <div class="field">
            <label for="ctpvNm">시도</label>
            <select id="ctpvNm" name="ctpvNm">
                <option value="">전체</option>
                <option th:each="sido : ${sidoList}" th:value="${sido}" th:text="${sido}"></option>
            </select>
        </div>

        <div class="field">
            <label for="sggNm">시군구</label>
            <input type="text" id="sggNm" name="sggNm" placeholder="예: 송파구 (비워두면 전체)">
        </div>

        <button type="submit">내 혜택 찾기</button>
    </form>
</div>
</body>
</html>
