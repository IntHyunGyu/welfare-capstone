<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 복지 - 내 정보 입력</title>
    <style>
        :root {
            --accent: #3182f6;
            --accent-soft: #eef3ff;
            --ink: #191f28;
            --ink-sub: #6b7684;
            --line: #e5e8eb;
            --surface: #f2f4f6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: var(--surface);
            margin: 0;
            color: var(--ink);
        }
        .container { max-width: 560px; margin: 0 auto; padding: 48px 20px 100px; }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
        .brand .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
        .brand span { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
        .subtitle { color: var(--ink-sub); margin: 0 0 32px; font-size: 15px; line-height: 1.5; }

        .card { background: #fff; border-radius: 20px; padding: 8px 24px 4px; box-shadow: 0 2px 10px rgba(25, 31, 40, 0.04); }

        section.field-group { padding: 22px 0; border-bottom: 1px solid var(--line); }
        section.field-group:last-of-type { border-bottom: none; }
        .field-group h2 { font-size: 15px; font-weight: 700; margin: 0 0 3px; }
        .field-group .hint { font-size: 13px; color: var(--ink-sub); margin: 0 0 14px; }

        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { position: relative; display: inline-flex; }
        .chip input { position: absolute; opacity: 0; width: 0; height: 0; }
        .chip .chip-label {
            display: inline-flex; align-items: center; padding: 9px 16px;
            border-radius: 999px; border: 1.5px solid var(--line); background: #fff;
            font-size: 14px; color: var(--ink-sub); cursor: pointer; user-select: none;
            transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
        }
        .chip .chip-label:hover { border-color: #c9ced6; }
        .chip:has(input:checked) .chip-label { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--ink); }
        .field input[type=number], .field input[type=text], .field select {
            width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px;
            font-size: 14px; background: var(--surface); color: var(--ink); transition: border-color 0.12s ease, background 0.12s ease;
        }
        .field input:focus, .field select:focus {
            outline: none; border-color: var(--accent); background: #fff;
        }

        .submit-area { margin-top: 24px; }
        button {
            width: 100%; padding: 16px; border: none; border-radius: 14px;
            background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
            transition: background 0.12s ease, transform 0.05s ease;
        }
        button:hover { background: #1b64da; }
        button:active { transform: scale(0.99); }

        @media (max-width: 480px) {
            .row2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="brand">
        <div class="mark">오</div>
        <span>오늘의 복지</span>
    </div>
    <h1>내 조건을 알려주세요</h1>
    <p class="subtitle">체크만 하면, 오늘 나에게 해당되는 지자체 복지혜택을 찾아드려요.</p>

    <form th:action="@{/profile}" method="post">
        <div class="card">
            <section class="field-group">
                <h2>생애주기</h2>
                <p class="hint">해당되는 항목을 모두 골라주세요</p>
                <div class="chip-group">
                    <label class="chip" th:each="stage : ${lifeStages}">
                        <input type="checkbox" name="lifeCodes" th:value="${stage.code}">
                        <span class="chip-label" th:text="${stage.label}"></span>
                    </label>
                </div>
            </section>

            <section class="field-group">
                <h2>가구상황</h2>
                <p class="hint">해당되는 항목을 모두 골라주세요</p>
                <div class="chip-group">
                    <label class="chip" th:each="h : ${householdSituations}">
                        <input type="checkbox" name="householdCodes" th:value="${h.code}">
                        <span class="chip-label" th:text="${h.label}"></span>
                    </label>
                </div>
            </section>

            <section class="field-group">
                <h2>관심주제</h2>
                <p class="hint">궁금한 주제를 모두 골라주세요</p>
                <div class="chip-group">
                    <label class="chip" th:each="t : ${interestThemes}">
                        <input type="checkbox" name="themeCodes" th:value="${t.code}">
                        <span class="chip-label" th:text="${t.label}"></span>
                    </label>
                </div>
            </section>

            <section class="field-group">
                <h2>나이 · 지역</h2>
                <p class="hint">정확한 결과를 위해 입력해주세요</p>
                <div class="row2">
                    <div class="field">
                        <label for="age">나이</label>
                        <input type="number" id="age" name="age" min="0" max="120" placeholder="예: 27">
                    </div>
                    <div class="field">
                        <label for="ctpvNm">시도</label>
                        <select id="ctpvNm" name="ctpvNm">
                            <option value="">전체</option>
                            <option th:each="sido : ${sidoList}" th:value="${sido}" th:text="${sido}"></option>
                        </select>
                    </div>
                </div>
                <div class="field" style="margin-top: 14px;">
                    <label for="sggNm">시군구</label>
                    <input type="text" id="sggNm" name="sggNm" placeholder="예: 송파구 (비워두면 전체)">
                </div>
            </section>
        </div>

        <div class="submit-area">
            <button type="submit">내 혜택 찾기</button>
        </div>
    </form>
</div>
</body>
</html>
