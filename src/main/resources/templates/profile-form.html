<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 복지 - 내 정보 입력</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{fragments/head :: common}"></th:block>
</head>
<body>
<main class="container">
    <div class="top">
        <a th:replace="~{fragments/brand :: brand}"></a>
        <div class="nav-links">
            <a class="back-link" th:href="@{/favorites}"><svg th:replace="~{fragments/icons :: bookmarkOutline}"></svg>저장한 혜택</a>
            <th:block th:replace="~{fragments/account :: links}"></th:block>
        </div>
    </div>
    <h1>내 조건을 알려주세요</h1>
    <p class="subtitle">체크만 하면, 오늘 나에게 해당되는 지자체 복지혜택을 찾아드려요.</p>

    <div class="form-notice error" th:if="${formError}" th:text="${formError}" role="alert"></div>

    <form th:action="@{/profile}" method="post">
        <div class="form-card">
            <section class="field-group">
                <h2>생애주기</h2>
                <p class="hint">해당되는 항목을 모두 골라주세요</p>
                <div class="chip-group">
                    <label class="chip" th:each="stage : ${lifeStages}">
                        <input type="checkbox" name="lifeCodes" th:value="${stage.code}"
                               th:checked="${#lists.contains(profileForm.lifeCodes, stage.code)}">
                        <span class="chip-label" th:text="${stage.label}"></span>
                    </label>
                </div>
            </section>

            <section class="field-group">
                <h2>가구상황</h2>
                <p class="hint">해당되는 항목을 모두 골라주세요</p>
                <div class="chip-group">
                    <label class="chip" th:each="h : ${householdSituations}">
                        <input type="checkbox" name="householdCodes" th:value="${h.code}"
                               th:checked="${#lists.contains(profileForm.householdCodes, h.code)}">
                        <span class="chip-label" th:text="${h.label}"></span>
                    </label>
                </div>
            </section>

            <section class="field-group">
                <h2>관심주제</h2>
                <p class="hint">궁금한 주제를 모두 골라주세요</p>
                <div class="chip-group">
                    <label class="chip" th:each="t : ${interestThemes}">
                        <input type="checkbox" name="themeCodes" th:value="${t.code}"
                               th:checked="${#lists.contains(profileForm.themeCodes, t.code)}">
                        <span class="chip-label" th:text="${t.label}"></span>
                    </label>
                </div>
            </section>

            <section class="field-group">
                <h2>나이 · 지역</h2>
                <p class="hint">시도를 고르면 그 지역에서 받을 수 있는 혜택만 보여드려요</p>
                <div class="row2">
                    <div class="field">
                        <label for="age">나이</label>
                        <input type="number" id="age" name="age" min="0" max="120" placeholder="예: 27"
                               th:value="${profileForm.age}" aria-describedby="age-hint">
                        <p class="field-hint" id="age-hint">아직은 결과에 반영되지 않아요</p>
                    </div>
                    <div class="field">
                        <label for="ctpvNm">시도</label>
                        <select id="ctpvNm" name="ctpvNm">
                            <option value="">전체</option>
                            <option th:each="sido : ${regions.keySet()}" th:value="${sido}" th:text="${sido}"
                                    th:selected="${sido == profileForm.ctpvNm}"></option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="sggNm">시군구</label>
                    <select id="sggNm" name="sggNm" disabled th:attr="data-selected=${profileForm.sggNm}">
                        <option value="">시도를 먼저 골라주세요</option>
                    </select>
                </div>
            </section>
        </div>

        <div class="submit-area">
            <button class="submit" type="submit">내 혜택 찾기</button>
        </div>
    </form>
</main>
<script th:inline="javascript">window.REGIONS = /*[[${regions}]]*/ {};</script>
<script th:src="@{/js/region.js}"></script>
</body>
</html>
