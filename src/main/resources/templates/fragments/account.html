<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="links">
    <a class="back-link" sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
    <th:block sec:authorize="isAuthenticated()">
        <a class="back-link" sec:authorize="hasRole('ADMIN')" th:href="@{/manage}">관리자</a>
        <!-- 모바일에선 아이디(nav-text)를 숨기고 아이콘만 남긴다 — 긴 아이디가 버튼 줄을 두 줄로 밀어내지 않게 -->
        <a class="back-link" th:href="@{/mypage}"
           th:attr="aria-label=${#authentication.name} + '님 마이페이지',title='마이페이지'">
            <svg th:replace="~{fragments/icons :: person}"></svg><span class="nav-text"><span sec:authentication="name"></span>님</span>
        </a>
        <form class="inline-form" th:action="@{/logout}" method="post">
            <button class="back-link" type="submit">로그아웃</button>
        </form>
    </th:block>
</th:block>
</body>
</html>
