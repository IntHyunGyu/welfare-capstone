<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- from: 상세 화면의 "돌아가기"가 어디로 갈지 정한다 (match / favorites) -->
<div class="result-card" th:fragment="card(b, from)">
    <div class="card-head">
        <h2 th:text="${b.servNm}"></h2>
        <th:block th:replace="~{fragments/icons :: favButton(${b.servId})}"></th:block>
    </div>
    <p class="dgst" th:if="${b.servDgst}" th:text="${b.servDgst}"></p>
    <div class="meta">
        <span class="badge-new" th:if="${b.recentlyUpdated}"
              th:text="'최근 업데이트 · ' + ${#strings.substring(b.lastModYmd, 4, 6)} + '.' + ${#strings.substring(b.lastModYmd, 6, 8)}"></span>
        <span th:if="${b.sprtCycNm}" th:text="'지원주기 · ' + ${b.sprtCycNm}"></span>
        <span th:if="${b.aplyMtdNm}" th:text="'신청방법 · ' + ${b.aplyMtdNm}"></span>
        <span th:if="${b.ctpvNm}" th:text="${b.ctpvNm} + (${b.sggNm} != null ? ' ' + ${b.sggNm} : '')"></span>
    </div>
    <div class="card-footer">
        <a class="text-link" th:if="${b.servDtlLink}" th:href="${b.servDtlLink}" target="_blank" rel="noopener"
           aria-label="복지로 원문 (새 창에서 열림)">복지로 원문 <span aria-hidden="true">↗</span></a>
        <a class="pill-link" th:href="@{/benefits/{id}(id=${b.servId}, from=${from})}">자세히 보기 →</a>
    </div>
</div>
</body>
</html>
