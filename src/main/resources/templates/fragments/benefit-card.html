<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="result-card" th:fragment="card(b)">
    <div class="card-head">
        <h2 th:text="${b.servNm}"></h2>
        <button type="button" class="fav-btn" th:attr="data-fav-id=${b.servId}" aria-pressed="false">☆ 저장</button>
    </div>
    <p class="dgst" th:if="${b.servDgst}" th:text="${b.servDgst}"></p>
    <div class="meta">
        <span class="badge-new" th:if="${b.recentlyUpdated}"
              th:text="'최근 업데이트 · ' + ${#strings.substring(b.lastModYmd, 4, 6)} + '.' + ${#strings.substring(b.lastModYmd, 6, 8)}"></span>
        <span th:if="${b.sprtCycNm}" th:text="'지원주기 · ' + ${b.sprtCycNm}"></span>
        <span th:if="${b.aplyMtdNm}" th:text="'신청방법 · ' + ${b.aplyMtdNm}"></span>
        <span th:if="${b.ctpvNm}" th:text="${b.ctpvNm} + (${b.sggNm} != null ? ' ' + ${b.sggNm} : '')"></span>
    </div>
    <div class="card-footer">
        <a class="text-link" th:if="${b.servDtlLink}" th:href="${b.servDtlLink}" target="_blank" rel="noopener">복지로 원문</a>
        <a class="pill-link" th:href="@{/benefits/{id}(id=${b.servId})}">자세히 보기 →</a>
    </div>
</div>
</body>
</html>
