<!DOCTYPE html>

<body>

<svg th:fragment="bookmarkFilled" class="icon icon-filled" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6 3.5h12a1.5 1.5 0 0 1 1.5 1.5v15.2a.8.8 0 0 1-1.27.65L12 16.4l-6.23 4.45A.8.8 0 0 1 4.5 20.2V5A1.5 1.5 0 0 1 6 3.5Z"

<th:block th:fragment="favButton(id)">
    <button type="button" class="fav-btn" th:attr="data-fav-id=${id}" aria-pressed="false">
        <svg th:replace="~{fragments/icons :: bookmarkOutline}"></svg>
        <svg th:replace="~{fragments/icons :: bookmarkFilled}"></svg>
        <span class="fav-label">저장</span>
    </button>
</th:block>
</body>
</html>
