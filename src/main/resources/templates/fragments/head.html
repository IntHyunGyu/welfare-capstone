<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:fragment="common">
        <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
        <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
        <link rel="icon" th:href="@{/favicon-32.png}" type="image/png" sizes="32x32">
        <link rel="icon" th:href="@{/favicon-16.png}" type="image/png" sizes="16x16">
        <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
        <link rel="manifest" th:href="@{/site.webmanifest}">
        <meta name="theme-color" content="#13A5A8">
        <!-- 스크립트의 POST(fetch)가 CSRF 검사를 통과하도록 토큰을 헤더로 실어 보낼 때 쓴다 -->
        <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
        <!-- 로그인 회원이면 저장 버튼이 이 API(DB)를 쓰고, 없으면 브라우저 localStorage를 쓴다 (favorites.js) -->
        <meta name="fav-api" sec:authorize="isAuthenticated()" th:content="@{/api/favorites}">
    </th:block>
</head>
</html>
