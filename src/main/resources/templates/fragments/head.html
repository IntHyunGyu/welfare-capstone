<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="icons">
        <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
        <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
        <link rel="icon" th:href="@{/favicon-32.png}" type="image/png" sizes="32x32">
        <link rel="icon" th:href="@{/favicon-16.png}" type="image/png" sizes="16x16">
        <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
        <link rel="manifest" th:href="@{/site.webmanifest}">
        <meta name="theme-color" content="#13A5A8">
    </th:block>
</head>
</html>
