# 배포용 프로필. 값은 배포 플랫폼(Railway)의 환경변수로 넣는다.
# 필요한 변수: DB_URL / DB_USERNAME / DB_PASSWORD (빠지면 DB 연결 단계에서 실패),
# WELFARE_API_SERVICE_KEY, ANTHROPIC_API_KEY(없으면 요약 생략), ADMIN_USERNAMES(관리자 아이디), PORT(선택, 기본 8080)
server:
  port: ${PORT:8080}

spring:
  datasource:
    # 예: jdbc:mysql://<host>:3306/<db>?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
  thymeleaf:
    cache: true
